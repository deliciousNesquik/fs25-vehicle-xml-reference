site_name: FS25 Vehicle XML Reference
site_description: Справочник по XML техники и оборудования Farming Simulator 25.
site_url: https://deliciousnesquik.github.io/fs25-vehicle-xml-reference/

repo_url: https://github.com/deliciousNesquik/fs25-vehicle-xml-reference
repo_name: deliciousNesquik/fs25-vehicle-xml-reference

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - footnotes
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Обзор: index.md
  - modDesc:
      - Корень (descVersion): mod-desc/root.md
      - author (и соавторы): mod-desc/author.md
      - version: mod-desc/version.md
      - title: mod-desc/title.md
      - description: mod-desc/description.md
      - iconFilename: mod-desc/icon-filename.md
      - multiplayer: mod-desc/multiplayer.md
      - l10n: mod-desc/l10n.md
  - Base:
      - typeDesc: base/type-desc.md
      - filename: base/filename.md
      - sounds: base/sounds.md
      - size: base/size.md
      - schemaOverlay: base/schema-overlay.md
      - mapHotspot: base/map-hotspot.md
      - components: base/components.md
      - i3dMappings: base/i3d-mappings.md
  - Specializations:
      - ai: specializations/ai.md
      - licensePlates: specializations/license-plates.md
      - powerTakeOffs: specializations/power-take-offs.md
      - foliageBending: specializations/foliage-bending.md
      - wearable: specializations/wearable.md
      - washable: specializations/washable.md
  - Concepts:
      - Объявление XML: concepts/xml-declaration.md
      - CDATA: concepts/cdata.md
