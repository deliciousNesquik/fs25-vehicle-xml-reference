site_name: FS25 Vehicle XML Reference
site_description: Справочник по XML техники и оборудования Farming Simulator 25.
site_url: https://deliciousnesquik.github.io/fs25-vehicle-xml-reference/

repo_url: https://github.com/deliciousNesquik/fs25-vehicle-xml-reference
repo_name: deliciousNesquik/fs25-vehicle-xml-reference

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - footnotes
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Обзор: index.md
  - modDesc:
      - Корень (descVersion): mod-desc/root.md
      - author (и соавторы): mod-desc/author.md
      - version: mod-desc/version.md
      - title: mod-desc/title.md
      - description: mod-desc/description.md
      - iconFilename: mod-desc/icon-filename.md
      - multiplayer: mod-desc/multiplayer.md
      - l10n: mod-desc/l10n.md
      - specializations: mod-desc/specializations.md
      - extraSourceFiles: mod-desc/extra-source-files.md
      - dependencies: mod-desc/dependencies.md
      - isSelectable: mod-desc/is-selectable.md
      - uniqueType: mod-desc/unique-type.md
      - vehicleTypes: mod-desc/vehicle-types.md
      - placeableSpecializations: mod-desc/placeable-specializations.md
      - placeableTypes: mod-desc/placeable-types.md
      - handToolSpecializations: mod-desc/handtool-specializations.md
      - handToolTypes: mod-desc/handtool-types.md
      - jointTypes: mod-desc/joint-types.md
      - storeItems: mod-desc/store-items.md
      - storeCategories: mod-desc/store-categories.md
      - brands: mod-desc/brands.md
      - actions: mod-desc/actions.md
      - inputBinding: mod-desc/input-binding.md
      - fillTypes: mod-desc/fill-types.md
      - helpLines: mod-desc/help-lines.md
      - densityMapHeightTypes: mod-desc/density-map-height-types.md
      - materialTemplates: mod-desc/material-templates.md
      - connectionHoses: mod-desc/connection-hoses.md
      - bales: mod-desc/bales.md
      - missionVehicles: mod-desc/mission-vehicles.md
      - maps: mod-desc/maps.md
      - materialHolders: mod-desc/material-holders.md
      - consumables: mod-desc/consumables.md
      - wildlife: mod-desc/wildlife.md
  - Base:
      - typeDesc: base/type-desc.md
      - filename: base/filename.md
      - sounds: base/sounds.md
      - size: base/size.md
      - schemaOverlay: base/schema-overlay.md
      - mapHotspot: base/map-hotspot.md
      - components: base/components.md
      - i3dMappings: base/i3d-mappings.md
      - Материалы и покраска: base/materials-paint.md
      - baseColorConfigurations: base/base-color-configurations.md
  - Specializations:
      - foldable: specializations/foldable.md
      - cultivator: specializations/cultivator.md
      - ai: specializations/ai.md
      - licensePlates: specializations/license-plates.md
      - powerTakeOffs: specializations/power-take-offs.md
      - foliageBending: specializations/foliage-bending.md
      - wearable: specializations/wearable.md
      - washable: specializations/washable.md
  - Concepts:
      - Объявление XML: concepts/xml-declaration.md
      - CDATA: concepts/cdata.md
      - parentFile (наследование XML): concepts/parent-file.md
      - Конфигурации техники в магазине: concepts/vehicle-configurations.md
      - Кастомная покраска (скрипт): concepts/custom-paint-script.md
